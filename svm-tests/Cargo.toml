[workspace]

[package]
name = "u64se-svm-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
mollusk-svm = "0.15.1"
solana-program = "2.2.0"
solana-sdk = "2.2.0"
solana-account = "4.3.2"
solana-instruction = "3.4.1"
solana-pubkey = "4.2.1"
solana-program-error = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
