[package]
name = "u64se-seu-solana"
version = "0.2.0"
edition = "2021"
description = "64-bit branchless state execution unit for Solana SVM (u64se-seu-solana.so)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/u64se/seu-solana"
documentation = "https://docs.rs/u64se-seu-solana"
readme = "README.md"
keywords = ["solana", "svm", "fsm", "state-machine", "zero-copy"]
categories = ["cryptography::cryptocurrencies", "no-std", "embedded"]

[lib]
name = "u64se_seu_solana"
crate-type = ["cdylib", "lib"]

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"

[dependencies]
pinocchio = { version = "0.11", default-features = false, optional = true }
solana-address = { version = "2.7", default-features = false, features = ["curve25519"], optional = true }
solana-define-syscall = { version = "4.0", optional = true }
bytemuck = { version = "1.18", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1.6"

[features]
default = ["solana", "std"]
solana = ["dep:pinocchio", "dep:solana-address", "dep:solana-define-syscall"]
no-entrypoint = []
bytemuck = ["dep:bytemuck"]
std = []
