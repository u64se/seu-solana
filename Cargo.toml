[package]
name = "u64se-seu-solana"
version = "0.1.0"
edition = "2021"
description = "64-bit branchless state execution unit for Solana SVM (u64se-seu-solana.so)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/u64se/seu-solana"
documentation = "https://docs.rs/u64se-seu-solana"
readme = "README.md"
keywords = ["solana", "svm", "fsm", "state-machine", "zero-copy"]
categories = ["cryptography::cryptocurrencies", "no-std", "embedded"]

[lib]
name = "u64se_seu_solana"
crate-type = ["cdylib", "lib"]

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"

[dependencies]
pinocchio = { version = "0.11", default-features = false }
solana-address = { version = "2.7", default-features = false, features = ["curve25519"] }
solana-define-syscall = "4.0"

[dev-dependencies]
proptest = "1.6"

[features]
default = []
no-entrypoint = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false
strip = true
