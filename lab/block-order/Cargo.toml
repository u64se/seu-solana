[package]
name = "u64se-block-order"
version = "0.2.0"
edition = "2021"
description = "Empirical Solana Mainnet validator block-ordering radar & StateExecutionUnit telemetry probe"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "u64se_block_order"
path = "src/lib.rs"

[[bin]]
name = "block-order-lab"
path = "src/main.rs"

[dependencies]
u64se-seu-solana = { path = "../..", default-features = false, features = ["std"] }
ed25519-dalek = "=1.0.1"
bs58 = "=0.5.1"
base64 = "=0.22.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "=2.12.1", features = ["json"] }
