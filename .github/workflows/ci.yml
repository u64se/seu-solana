name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  formal-verification:
    name: Z3 Formal Invariant Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Z3 SMT Solver
        run: |
          sudo apt-get update
          sudo apt-get install -y z3

      - name: Verify 15 Mathematical & Block-Ordering Invariants
        run: |
          echo "Running Z3 on verify_invariants.smt2..."
          output=$(z3 verify_invariants.smt2)
          echo "$output"
          
          # Count proven theorems (unsat)
          unsat_count=$(echo "$output" | grep -c "^unsat$")
          echo "Theorems proven: $unsat_count / 15"
          if [ "$unsat_count" -ne 15 ]; then
            echo "Error: Expected exactly 15 proven invariants (unsat), but got $unsat_count"
            exit 1
          fi

  rust-test:
    name: Rust Host ALU, Block-Order-Lab & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check core crate compilation
        run: cargo check --release

      - name: Run core unit tests
        run: cargo test --release -- --nocapture

      - name: Run host benchmark
        run: cargo run --release --example benchmark

      - name: Check block-order-lab telemetry suite
        run: cargo check --release --manifest-path lab/block-order/Cargo.toml
